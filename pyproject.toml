[project]
name = "nowcast"
version = "0.1.0"
description = "Component-level CPI/PPI/PCE nowcasting: MoM surprise forecasts via official-methodology aggregation"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.3",
    "numpy==2.5.1",
    "statsmodels==0.14.6",
    "pyyaml==6.0.3",
    "pytest==9.1.1",
    "jupyter==1.1.1",
    "naru-data==0.1.0",
    "matplotlib==3.11.1",
]

[tool.uv.sources]
# naru is under active local development; this project is its torture test
# (CLAUDE.md rule 3), so it installs editable from the local clone.
naru-data = { path = "/Users/zinuoshi/naru", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nowcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
