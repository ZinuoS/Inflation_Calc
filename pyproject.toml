[project]
name = "nowcast"
version = "0.1.0"
description = "Component-level CPI/PPI/PCE nowcasting: MoM surprise forecasts via official-methodology aggregation"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.3",
    "numpy==2.5.1",
    "statsmodels==0.14.6",
    "pyyaml==6.0.3",
    "pytest==9.1.1",
    "jupyter==1.1.1",
    "naru-data==0.1.0",
    "matplotlib==3.11.1",
]

[tool.uv.sources]
# naru is pinned to an EXACT commit on GitHub for reproducibility (a path/branch
# install builds from the working tree, which is not reproducible). Installed
# non-editable from the git source: a full wheel unpack carries the real modules AND
# the force-included examples, side-stepping the editable-install shadow bug (naru#5).
# commit 35a2612 = the CSV/TSV source reader (naru#1), on branch
# feat/csv-tsv-source-reader. When naru advances, bump rev and run:
# uv sync --reinstall-package naru-data.
naru-data = { git = "https://github.com/ZinuoS/naru-data", rev = "35a26120db5db7c06e8e7e4d7238d9a2b5211311" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nowcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
