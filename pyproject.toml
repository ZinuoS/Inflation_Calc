[project]
name = "nowcast"
version = "0.1.0"
description = "Component-level CPI/PPI/PCE nowcasting: MoM surprise forecasts via official-methodology aggregation"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.3",
    "numpy==2.5.1",
    "statsmodels==0.14.6",
    "pyyaml==6.0.3",
    "pytest==9.1.1",
    "jupyter==1.1.1",
    "naru-data==0.1.0",
    "matplotlib==3.11.1",
]

[tool.uv.sources]
# naru is installed NON-editable from the local clone. Editable install is
# broken by naru's own packaging (it force-includes examples into naru/_examples,
# which creates a site-packages/naru/ dir that shadows the editable src -- logged
# as naru#5 in docs/naru_gaps.md). A full wheel unpack carries the real modules
# AND the examples, so import works. After changing naru, refresh with:
#   uv sync --reinstall-package naru-data
naru-data = { path = "/Users/zinuoshi/naru", editable = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nowcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
