# nadac pipeline spec (Session 2B, Group A / Task 3)
source: nadac
description: >
  CMS NADAC per-NDC retail drug acquisition cost -> a monthly drug-price index.
  Published-proxy for CPI Prescription drugs (SEMF01). Reconciled against medical-care
  commodities (SAM1) as the finest ALFRED-vintaged official stand-in (SEMF01 has no
  ALFRED vintages).
vintage_status: unrevised

# Per-year download URLs enumerated DETERMINISTICALLY from the data.medicaid.gov
# catalog API (search fulltext=NADAC), not guessed. Backfill window 2021-2025 pulled
# (C5, Session 2B-final) to clear insufficient_overlap; full 2013-2026 available in the
# catalog if deeper history is wanted (each file ~139 MB).
year_urls:
  2021: https://download.medicaid.gov/data/national-average-drug-acquisition-cost-12-29-2021.csv
  2022: https://download.medicaid.gov/data/nadac-national-average-drug-acquisition-cost-2022.csv
  2023: https://download.medicaid.gov/data/nadac-national-average-drug-acquisition-cost-12-27-2023.csv
  2024: https://download.medicaid.gov/data/nadac-national-average-drug-acquisition-cost-12-25-2024.csv
  2025: https://download.medicaid.gov/data/nadac-national-average-drug-acquisition-cost-12-31-2025.csv
years: [2021, 2022, 2023, 2024, 2025]
date_format: "%m/%d/%Y"

# index construction (PLACEHOLDER -- 3A upgrade to weighted matched-model)
basket_rule:
  aggregate_ndc_to: monthly_mean_per_ndc     # mean nadac_per_unit within month per NDC
  index_formula: matched_model_geomean_relatives  # Jevons-style, NDCs in both months
  base: 100.0
  min_matched_ndcs: 50                        # months with fewer matched NDCs -> skip
columns: {ndc: "NDC", price: "NADAC Per Unit", date: "Effective Date"}

series_key: US_drug_index
mapped_strata: [SEMF01]
proxy_history_start_planned: 2013

publication:
  kind: scheduled
  rule: nadac_weekly            # monthly aggregate complete once M last week posts (CMS Weds)
  lag_days: 7
  observed_asof_estimated: false
  cite: https://www.medicaid.gov/medicaid/prescription-drugs/pharmacy-pricing/index.html
  note: "CMS NADAC weekly reference file; month M complete ~1 week after month end"
