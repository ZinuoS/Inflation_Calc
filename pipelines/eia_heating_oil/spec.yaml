# eia_heating_oil pipeline spec (Session 2B, Group A)
source: eia_heating_oil
description: >
  EIA No.2 heating oil NY Harbor daily SPOT price (via FRED DHOILNYH). WEAK
  wholesale proxy for CPI Fuel oil (retail); see license_note.md caveat. Stored
  daily; monthly alignment in alignment.py.
vintage_status: unrevised
fred_series_id: DHOILNYH
frequency: daily
series_key: US_NYH_SPOT
mapped_strata: [SEHE01]        # Fuel oil (approx)
proxy_history_start_planned: 1990
proxy_caveat: wholesale_spot_not_retail

publication:
  kind: scheduled
  rule: daily_next_bday         # daily NY Harbor spot, available next business day
  observed_asof_estimated: false
  cite: https://www.eia.gov/petroleum/gasdiesel/
  note: "daily spot published final next business day"
