row_count:
  min: 1
key_uniqueness:
  - columns: [series_id, period]
null_policy:
  - {column: source, nulls_allowed: false}
  - {column: series_id, nulls_allowed: false}
  - {column: seasonal, nulls_allowed: false}
  - {column: period, nulls_allowed: false}
  - {column: value, nulls_allowed: false}
