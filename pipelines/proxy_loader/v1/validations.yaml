row_count:
  min: 1

key_uniqueness:
  - columns: [source, series_key, period]

null_policy:
  - column: source
    nulls_allowed: false
  - column: series_key
    nulls_allowed: false
  - column: frequency
    nulls_allowed: false
  - column: period
    nulls_allowed: false
  - column: value
    nulls_allowed: false
  - column: vintage_status
    nulls_allowed: false
  - column: observed_date
    nulls_allowed: false
