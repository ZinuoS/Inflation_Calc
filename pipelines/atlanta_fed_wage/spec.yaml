  rule: monthly_release_lag
  lag_days: 45                  # Atlanta Fed Wage Growth Tracker ~mid M+1 + 7d conservatism
  observed_asof_estimated: true
  cite: https://www.atlantafed.org/chcs/wage-growth-tracker
