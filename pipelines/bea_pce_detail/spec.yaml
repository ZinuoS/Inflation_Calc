# bea_pce_detail pipeline spec (Session: BEA ingestion) — the true PCE weights + price detail
source: bea_pce_detail
description: >
  BEA NIPA underlying detail: Table 2.4.5U (U20405, nominal PCE by type of product — the
  bridge's true expenditure WEIGHTS) and Table 2.4.4U (U20404, price indexes — per-component
  PCE actuals for the valid-gate ATTRIBUTION and validation). Monthly. official_current;
  methodology/validation only, NEVER a proxy feature or a backtest target.
vintage_status: official_current
methodology_replication_only: true

api:
  provider: BEA
  base_url: https://apps.bea.gov/api/data
  dataset: NIUnderlyingDetail
  frequency: M
  requires_env_key: BEA_API_KEY
  tables:
    U20405: nominal        # RC series (current $, millions) -> weights
    U20404: price          # RG series (chain price index, 2017=100) -> attribution/actuals
  years: "2010-2026"       # covers the 5y eval + prior-year weights with margin

# official_current staged columns: source, series_id (BEA SeriesCode, e.g. DNMVRC/DNMVRG),
# item_code (=SeriesCode), seasonal (SA — BEA monthly are seasonally adjusted), frequency,
# period (YYYY-MM-01), value. RC vs RG suffix keeps nominal and price distinct (no collision).

publication:                 # Task 0: structural weights input — annual, knowable far ahead
  kind: scheduled
  rule: annual_plus_comprehensive_revision
  observed_asof_estimated: false
  cite: https://www.bea.gov/data/consumer-spending/main   # NIPA release + annual/comprehensive update schedule
  # H16 (2026-07-25) — MONTHLY cadence recorded explicitly. BEA publishes the Underlying Detail
  # tables as "Annual, Quarterly, and Monthly estimates" on the Personal Income & Outlays cycle
  # (cite above; verified "Current release: June 25, 2026 / Next release: July 30, 2026").
  monthly_detail:
    kind: scheduled
    rule: pce_release_for_reference_month      # 2.4.5U for ref month M is public at the PCE release for M
    lag_days: 55                               # observed M+1 day ~25-30 (release_calendar 2025-11..2026-11: +34..+60, median ~55)
    observed_asof_estimated: false
    firewall_note: >
      Instrument A calls month M on CPI-day (~M+1 day 10-13), which PRECEDES the PCE release for M.
      Therefore at that forecast time the freshest KNOWABLE nominal detail is reference month M-1
      (published ~M day 25-30). Using month-M shares to forecast month M is look-ahead and is
      disqualified. official_current carries no observed_asof column, so this lag rule IS the
      firewall for the weight path.
  note: >
    2.4.5U weights are a STRUCTURAL annual input, vintage-appropriate and knowable far ahead of
    any forecast time (no daily role). Monthly detail is revised with the monthly PCE release
    (~M+1) and restated at the annual update (late July) and comprehensive updates (~5y). For
    weights we use the vintage-appropriate ANNUAL nominal share, so within-month revision is
    immaterial; the biennial/annual weight-era annotation still applies pre-2023.
