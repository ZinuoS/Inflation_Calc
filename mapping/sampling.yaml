# CPI sampling design, per stratum (Session: sampling audit, Part A1)
#
# CITATIONS (BLS Handbook of Methods, CPI chapter — bls.gov/opub/hom/cpi/, retrieved 2026-07-23):
#  * collection frequency [data.htm]: "Food at home, energy, and selected other items are priced
#    monthly. So, too, are prices for all other commodity and service items in the three largest
#    publication areas: New York, Los Angeles, and Chicago. Elsewhere, prices are collected
#    bimonthly for the remaining commodity and service items; those are assigned to either even-
#    or odd-numbered months for pricing."
#    => non-food/energy strata are only PARTIALLY monthly; a shock outside the big-3 smears
#       across two prints. This is a MECHANICAL smoothing, not model error.
#  * housing panel [data.htm/design.htm]: "The housing sample is divided into six panels, with the
#    housing units in each panel priced twice per year." "Every month, we collect rent prices ...
#    and the 6-month price ratio is computed (the current rent divided by the rent 6 months ago)
#    ... measures of price change ... are based on weighted averages of these rent ratios."
#    => rent/OER are structurally slow BY DESIGN: a market-rent shock enters via 6-month ratios,
#       one panel per month. This is the DESIGN CAUSE of the H2 rent-lead result.
#  * quality adjustment [calculation.htm]: "direct quality adjustment information include
#    observable factors such as size or weight, manufacturers' cost data, and hedonic regression
#    models." The HOM does NOT enumerate which strata are hedonically adjusted -> recorded as
#    UNVERIFIED per stratum rather than asserted (no folklore).
#  * motor-vehicle-insurance premium-following: NOT documented in the HOM chapter; requires the
#    separate BLS factsheet. Left UNVERIFIED rather than assumed.
#
# COMPUTED (not cited): seasonal_reliability_bp = mean across calendar months of the std-dev of
# that month's NSA MoM across years (2014+). LOW = the seasonal-mean fallback is trustworthy;
# HIGH = the fallback is structurally weak for that stratum.
strata:
  SEFA01:
    name: Flour and prepared flour mixes
    weight_cpi_u: 0.038
    collection_frequency: monthly_all_areas
    within_month_window: collected across the month; BLS does not publish a per-stratum intra-month schedule (HOM silent)
      -> windows.py/H8 selects empirically
    panel_structure: outlet sample; monthly repricing in all areas
    quality_adjustment: direct methods incl. hedonic regression are used where quality change is observable; HOM does not
      enumerate per stratum -> UNVERIFIED per-stratum
    seasonal_reliability_bp: 109.3
