pce_bridge:
  note: 'Core-PCE assembly table (plan §1.3): after CPI+PPI print, PCE is arithmetic. source_series lists reference
    cpi item_codes (S*) and PPI series (PCU*) defined above; bea_imputed rows have source_series null and an approximation
    note. confidence: low rows are best-documented approximations, NOT verified BEA practice — review list in docs/checkpoint_log_s1.md.
    Core excludes food-off-premises and energy goods+services.'
  components:
  - component: new_motor_vehicles
    source_type: cpi_relative
    source_series:
    - SETA01
    scope_adjustment_note: fleet/consumer split differs; BEA quality-adjusts with own detail
    weight_source: bea_pce_detail_pipeline_nominal_shares
